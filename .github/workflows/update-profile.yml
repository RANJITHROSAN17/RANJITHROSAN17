name: Update profile README

# Public GitHub data -> validated SVGs + README + audit snapshot.
# Scheduled workflows run from the default branch; no personal token is needed.
on:
  schedule:
    # Daily at 00:17 UTC (05:47 IST). GitHub may delay scheduled starts.
    - cron: "17 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_profile.py"
      - ".github/scripts/profile_visuals.py"
      - ".github/scripts/test_*.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test data integrity and SVG rendering
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Fetch GitHub data and render the complete snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python .github/scripts/update_profile.py

      - name: Commit README, charts and real metric history together
        # Publish only from main. Branch runs still test and render, but do not
        # fight branch protection or update a non-profile branch automatically.
        if: github.ref == 'refs/heads/main'
        run: |
          git add README.md assets/generated data/profile-snapshot.json data/profile-history.json
          if git diff --cached --quiet; then
            echo "Profile already up to date - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh live GitHub visuals [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
